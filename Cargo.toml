[package]
name = "falcato"
version = "0.7.2"
edition = "2021"
authors = ["Falcato Team"]
description = "Lenguaje de programación de sistemas iberohablante sobre Cranelift"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CerebroCanibalus/falcato"

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "F0E1D2C3-B4A5-6789-0FED-CBA987654321"
license = false
eula = false

[[bin]]
name = "falcato"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Lexer
logos = "0.14"

# Parser (manual - sin dependencias externas)

# Cranelift Codegen (puro Rust, sin dependencias del sistema)
cranelift-codegen = "0.112"
cranelift-frontend = "0.112"
cranelift-module = "0.112"
cranelift-object = "0.112"
cranelift-native = "0.112"
target-lexicon = "0.12"

# LSP (Fase 2+)
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Testing (Fase 2+)
insta = "1.39"

# Utilities
thiserror = "1.0"
anyhow = "1.0"

# Paquetes (R8): formato falcato.toml / falcato.lock
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
