[project]
name = "forge"
version = "0.1.0"
description = "Automatización del pipeline de compilación para Falcato"
requires-python = ">=3.9"
dependencies = [
    "watchdog>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
