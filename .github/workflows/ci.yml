name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build runtime library (debug)
      run: cargo build --verbose
      working-directory: lib/falcato_runtime

    - name: Build compiler (debug)
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Build runtime library (release + static CRT)
      run: cargo build --release --verbose
      working-directory: lib/falcato_runtime

    - name: Build compiler (release + static CRT)
      run: cargo build --release --verbose
      env:
        RUSTFLAGS: -C target-feature=+crt-static

    - name: Build end-to-end examples
      shell: pwsh
      run: |
        foreach ($ex in @("hola_mundo", "con_executor_simple", "productor_consumidor")) {
          .\target\debug\falcato.exe compila "ejemplos\$ex.fc"
        }

    - name: Upload release binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: falcato-windows-x64
        path: target/release/falcato.exe
        if-no-files-found: error
