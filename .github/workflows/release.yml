name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build release binary (CRT estático)
      run: cargo build --release --verbose
      env:
        RUSTFLAGS: -C target-feature=+crt-static

    - name: Build VS Code extension (VSIX)
      shell: pwsh
      run: |
        cd falcato-vscode
        npm ci
        npx vsce package --no-dependencies
        $vsix = Get-Item *.vsix | Select-Object -First 1
        Write-Host "VSIX built: $($vsix.Name)"
        Copy-Item $vsix.FullName ..\release\bin\

    - name: Prepare release artifacts
      shell: pwsh
      run: |
        # Create directory structure
        New-Item -ItemType Directory -Force -Path release\bin
        New-Item -ItemType Directory -Force -Path release\ejemplos
        New-Item -ItemType Directory -Force -Path release\docs
        New-Item -ItemType Directory -Force -Path release\skills
        New-Item -ItemType Directory -Force -Path release\agents

        # Copy binary
        Copy-Item target\release\falcato.exe release\bin\

        # Copy examples
        Copy-Item ejemplos\*.fc release\ejemplos\

        # Copy docs
        Copy-Item README.md release\
        if (Test-Path LICENSE) { Copy-Item LICENSE release\ }

        # Copy skills & agents
        Copy-Item skills\* release\skills\ -Recurse
        Copy-Item agents\* release\agents\ -Recurse

        # Copy install.ps1
        Copy-Item install.ps1 release\

    - name: Create release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path release\* -DestinationPath "falcato-$($env:GITHUB_REF_NAME).zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: falcato-*.zip
        generate_release_notes: true
        body: |
          ## Falcato ${{ github.ref_name }}

          Lenguaje de programación de sistemas iberohablante sobre Cranelift.

          ### Instalación
          1. Descarga `falcato-${{ github.ref_name }}.zip`
          2. Extrae en cualquier carpeta
          3. Ejecuta `install.ps1` (PowerShell) — menú interactivo con opciones
          4. Abre una terminal nueva y escribe `falcato version`

          ### Qué instala install.ps1 (opcional, eliges cada uno):
          - ✅ falcato.exe en PATH (siempre)
          - 🔌 Extensión VS Code (syntax + LSP + tema Falcato Dorado)
          - 🤖 Agent + Skill para OpenCode
          - 🤖 Agent + Skill para Claude Code
          - 💡 Cursor: usa la misma extensión VS Code

          ### Requisitos
          - Windows 10 o superior (x86_64)
          - No requiere Rust ni VS Build Tools
